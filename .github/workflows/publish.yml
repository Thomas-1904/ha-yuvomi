name: Publish release

# Two ways to start it:
# - Actions → "Publish release" → Run workflow → enter the version (e.g. 0.5.3)
# - push a commit that changes the file .github/release-request (first line = version)
# Bumps the version, dates CHANGELOG.md, runs the tests, commits, tags,
# creates the GitHub release with the changelog section as text and attaches yuvomi.zip.

on:
  push:
    branches: [main]
    paths: [.github/release-request]
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.5.3"
        required: true
      dry_run:
        description: "Only check and show the release notes – publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"; else v="$(head -n1 .github/release-request | tr -d '[:space:]v')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Prepare version and changelog
        run: python scripts/prepare_release.py "${{ steps.v.outputs.version }}" "$RUNNER_TEMP/notes.md"

      - name: Release notes
        run: cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Tests
        run: |
          pip install -r requirements_test.txt
          pytest -q

      - name: Commit and tag
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.v.outputs.version }}"
          git tag "v${{ steps.v.outputs.version }}"
          git push origin main "v${{ steps.v.outputs.version }}"

      - name: Build yuvomi.zip
        if: env.DRY_RUN != 'true'
        run: cd custom_components/yuvomi && zip -r ../../yuvomi.zip . -x '__pycache__/*'

      - name: Create release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: yuvomi.zip
          make_latest: true
