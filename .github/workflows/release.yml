name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build yuvomi.zip
        run: cd custom_components/yuvomi && zip -r ../../yuvomi.zip . -x '__pycache__/*'
      - uses: softprops/action-gh-release@v3
        with:
          files: yuvomi.zip
